name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python plugins/engineering-figure-codex/skills/engineering-figure-codex/scripts/check_skill.py
      - run: python plugins/engineering-figure-codex/skills/engineering-figure-codex/scripts/build_prompt.py --brief examples/rag-architecture.brief.json --out output/rag-prompt.md
      - run: python plugins/engineering-figure-codex/skills/engineering-figure-codex/scripts/render_plot.py --spec examples/benchmark.plot-spec.json --out-dir output/benchmark --formats png svg pdf

